name: Smoke tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Windows PowerShell 5.1 smoke tests
        shell: powershell
        run: |
          .\tests\Smoke.ps1
          .\tests\MigrationPlan.ps1
          .\tests\Report24h.ps1
